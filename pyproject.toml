[project]
name = "document-insights"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    # Celery (Redis backend) for asynchronous background task execution.
    "celery[redis]>=5.4.0",
    # MongoDB driver.
    "pymongo>=4.6.0",
    "redis>=5.3.1",
    "python-decouple>=3.8",
    # Load local .env files for non-container development.
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["main.py", "schemas.py", "utils.py", "routers", "services", "core", "db", "workers"]
only-include = ["main.py", "schemas.py", "utils.py", "routers", "services", "core", "db", "workers"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059", "DTZ901"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
